<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель курьера - Candy Delivery</title>
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <h2>Candy Courier</h2>
            <nav>
                <ul>
                    <li><a href="#profile" class="active">Профиль</a></li>
                    <li><a href="#orders">Мои заказы</a></li>
                </ul>
            </nav>
            <button id="logoutBtn" class="logout-btn">Выйти</button>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Секция: Профиль -->
            <section id="profile-section" class="content-section active">
                <h1>Профиль курьера</h1>
                <div class="profile-info">
                    <p><strong>ID:</strong> <span id="courierId">-</span></p>
                    <p><strong>Тип:</strong> <span id="courierType">-</span></p>
                    <p><strong>Рейтинг:</strong> <span id="courierRating">-</span></p>
                    <p><strong>Заработок:</strong> <span id="courierEarnings">0</span> ₽</p>
                </div>
                <button id="getOrdersBtn" class="action-btn">Получить заказы</button>
            </section>

            <!-- Секция: Мои заказы -->
            <section id="orders-section" class="content-section">
                <h1>Мои заказы</h1>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Вес</th>
                            <th>Регион</th>
                            <th>Время доставки</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- JavaScript автоматически заполнит эту часть -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- Подключение скрипта -->
    <script src="/static/courier.js"></script>
</body>
</html>
