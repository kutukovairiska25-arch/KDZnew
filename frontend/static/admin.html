<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора - Candy Delivery</title>
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>Candy Admin</h2>
            <nav>
                <ul>
                    <li><a href="#couriers" class="active">Курьеры</a></li>
                    <li><a href="#orders">Заказы</a></li>
                    <li><a href="#import">Импорт данных</a></li>
                </ul>
            </nav>
            <button id="logoutBtn" class="logout-btn">Выйти</button>
        </aside>

        <main class="main-content">
            <section id="couriers-section" class="content-section active">
                <h1>Курьеры</h1>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Тип</th>
                            <th>Регионы</th>
                            <th>Рабочие часы</th>
                            <th>Рейтинг</th>
                            <th>Заработок</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>

            <section id="orders-section" class="content-section">
                <h1>Заказы</h1>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Вес</th>
                            <th>Регион</th>
                            <th>Статус</th>
                            <th>Курьер</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>

            <section id="import-section" class="content-section">
                <h1>Импорт данных</h1>
                <div class="import-forms">
                    <div class="import-block">
                        <h3>Импорт курьеров</h3>
                        <textarea id="couriersImportData" placeholder='[{"courier_id": 1, "courier_type": "bike", "regions": [1, 2], "working_hours": ["09:00-18:00"]}]'></textarea>
                        <button id="importCouriersBtn">Импортировать курьеров</button>
                    </div>
                    <div class="import-block">
                        <h3>Импорт заказов</h3>
                        <textarea id="ordersImportData" placeholder='[{"order_id": 1, "weight": 10.5, "region": 1, "delivery_hours": ["10:00-12:00"]}]'></textarea>
                        <button id="importOrdersBtn">Импортировать заказы</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="/static/admin.js"></script>
</body>
</html>
