<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Glassmorphism Login</title>

    <!-- Подключаем шрифты и иконки (они из интернета) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="/frontend/staticnd/static/newlogin.css">
</head>
<body>
    <!-- Главная коробка с эффектом стекла -->
    <div class="login-box">
        <form id="loginForm">
            <h2>LOGIN</h2>

            <div class="input-group">
                <i class="fas fa-user"></i>
                <label for="username"></label><input type="text" id="username" required>
                <label>Username</label>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <label for="password"></label><input id="password" required type="password">
                <label>Password</label>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">Sign In</button>

            <p class="signup-link">
                New here? <a href="#">Create Account</a>
            </p>
        </form>
    </div>

    <!-- ПОДКЛЮЧАЕМ ТВОЙ JS -->
    <script src="/frontend/staticnd/static/newlogin.js"></script>
</body>
</html>
